[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ditgs"
version = "0.1.0"
description = "Residual Cross-Attention feature readout for 3D Gaussian reconstruction"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "Apache-2.0"}
authors = [{name = "DiTGS contributors"}]
dependencies = [
  "torch==2.8.0", "torchvision==0.23.0", "numpy==1.26.4",
  "diffusers==0.35.1", "transformers==4.56.2", "accelerate==1.11.0",
  "huggingface-hub>=0.34,<1", "safetensors>=0.4.5", "sentencepiece>=0.2", "ftfy>=6.2",
  "einops>=0.8,<0.9", "tyro>=0.9,<1", "Pillow>=10", "packaging>=24",
  "imageio[ffmpeg]>=2.35", "lpips==0.1.4", "scikit-image==0.25.2",
  "matplotlib>=3.8", "plyfile>=1.0",
]

[project.optional-dependencies]
renderer = [
  "gsplat==1.5.3",
  "fused-ssim @ git+https://github.com/rahul-goel/fused-ssim.git@a7c48d6dd7ac6dc39a7958c7c4452e0b10418f38",
]

[project.urls]
Repository = "https://github.com/Qingzhongyun/DiTGS"
Issues = "https://github.com/Qingzhongyun/DiTGS/issues"

[tool.setuptools.packages.find]
include = ["ditgs*", "tokengs*"]

[tool.setuptools.package-data]
ditgs = ["assets/*.json"]
